<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipos del mundo</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mut:#777;--ln:#e4e4e4;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#eee;--mut:#8a8a8a;--ln:#262626;--card:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#eee;--mut:#8a8a8a;--ln:#262626;--card:#161616;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:inherit;background:none;color:var(--fg);border:1px solid var(--ln);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;outline:none;margin-bottom:8px}
input:focus{border-color:var(--fg)}
.lg{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:24px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;width:100%;font:inherit;color:var(--fg);text-align:left}
.row:hover{padding-left:10px}.row{transition:padding .15s}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.note{color:var(--mut);font-size:12px;margin-top:40px}
/* team page */
.team{--c1:#111;--c2:#fff;--on:#fff;min-height:100vh;background:color-mix(in srgb,var(--c1) 9%,#fff);color:#111}
.hero{background:var(--c1);color:var(--on);padding:calc(24px + env(safe-area-inset-top,0px)) 20px 36px;border-bottom:6px solid var(--c2)}
.hero>div,.body{max-width:720px;margin:0 auto}
.back{font:inherit;background:none;border:0;color:var(--on);opacity:.8;cursor:pointer;padding:0;margin-bottom:28px}
.hero h2{font-size:34px;margin:0;letter-spacing:-.02em}.hero p{margin:4px 0 0;opacity:.8}
.body{padding:24px 20px 56px}
.card{background:#fff;border:1px solid color-mix(in srgb,var(--c1) 22%,#fff);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--c1);filter:saturate(1.2) brightness(.85)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:500;color:#777;text-align:right;padding:4px 6px}td{padding:6px;text-align:right;border-top:1px solid #eee}
th:nth-child(2),td:nth-child(2){text-align:left}tr.me td{background:var(--c1);color:var(--on);border-color:var(--c1)}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eee}.m:first-of-type{border-top:0}
.m small{color:#777;display:block}.chip{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:600;font-size:13px;color:#fff}
.W{background:#2e9d57}.L{background:#d24444}.D{background:#999}
</style></head><body>
<div id="app"></div>
<script>
const S={futbol:"Fútbol",basquet:"Básquetbol",voley:"Vóleibol",beisbol:"Béisbol",hockey:"Hockey"};
const D=`futbol|Liga Argentina|River Plate|#d71920|#ffffff
futbol|Liga Argentina|Boca Juniors|#0b2e6b|#f5c400
futbol|Liga Argentina|Racing Club|#6cb4e4|#ffffff
futbol|Liga Argentina|Independiente|#d0021b|#ffffff
futbol|Liga Argentina|San Lorenzo|#0a2a5e|#c8102e
futbol|Liga Argentina|Estudiantes|#c8102e|#ffffff
futbol|LaLiga|Real Madrid|#00529f|#febe10
futbol|LaLiga|FC Barcelona|#a50044|#004d98
futbol|LaLiga|Atlético de Madrid|#cb3524|#272e61
futbol|LaLiga|Sevilla|#d4001f|#ffffff
futbol|LaLiga|Valencia|#f58a00|#111111
futbol|Premier League|Manchester City|#6cabdd|#1c2c5b
futbol|Premier League|Liverpool|#c8102e|#00b2a9
futbol|Premier League|Arsenal|#ef0107|#063672
futbol|Premier League|Chelsea|#034694|#ffffff
futbol|Premier League|Manchester United|#da291c|#fbe122
basquet|NBA|Los Angeles Lakers|#552583|#fdb927
basquet|NBA|Boston Celtics|#007a33|#ffffff
basquet|NBA|Chicago Bulls|#ce1141|#000000
basquet|NBA|Golden State Warriors|#1d428a|#ffc72c
basquet|NBA|Miami Heat|#98002e|#f9a01b
basquet|NBA|San Antonio Spurs|#c4ced4|#000000
voley|SuperLega (Italia)|Itas Trentino|#0057b8|#ffffff
voley|SuperLega (Italia)|Sir Safety Perugia|#111111|#ffd100
voley|SuperLega (Italia)|Cucine Lube Civitanova|#c8102e|#ffffff
voley|SuperLega (Italia)|Modena Volley|#ffd100|#1b1b1b
voley|Superliga (Brasil)|Sada Cruzeiro|#0057b8|#ffffff
voley|Superliga (Brasil)|Sesi Bauru|#e30613|#ffffff
beisbol|MLB|New York Yankees|#0c2340|#ffffff
beisbol|MLB|Boston Red Sox|#bd3039|#0c2340
beisbol|MLB|Los Angeles Dodgers|#005a9c|#ffffff
beisbol|MLB|Chicago Cubs|#0e3386|#cc3433
beisbol|MLB|San Francisco Giants|#fd5a1e|#000000
beisbol|MLB|St. Louis Cardinals|#c41e3a|#0c2340
hockey|NHL|Montréal Canadiens|#af1e2d|#192168
hockey|NHL|Toronto Maple Leafs|#00205b|#ffffff
hockey|NHL|Boston Bruins|#fcb514|#000000
hockey|NHL|New York Rangers|#0038a8|#ce1126
hockey|NHL|Chicago Blackhawks|#cf0a2c|#000000
hockey|NHL|Pittsburgh Penguins|#111111|#fcb514`;
const T=D.split("\n").map((l,i)=>{const[s,lg,n,c1,c2]=l.split("|");return{id:"t"+i,s,lg,n,c1,c2}});
const rng=str=>{let h=1779033703;for(const c of str)h=Math.imul(h^c.charCodeAt(0),3432918353);let a=h;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const std={};
function table(lg){if(std[lg])return std[lg];const ts=T.filter(t=>t.lg===lg),r=rng(lg),f=ts[0].s==="futbol";
const rows=ts.map(t=>{const n=f?20:30;let g,e=0,p;if(f){g=ri(r,3,12);e=ri(r,0,5)}else g=ri(r,8,24);p=n-g-e;return{t,n,g,e,p,pt:f?g*3+e:Math.round(g/n*1000)/10}});
rows.sort((a,b)=>b.pt-a.pt);return std[lg]=rows}
const lum=h=>{const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);return .2126*v[0]+.7152*v[1]+.0722*v[2]};
const sc=(s,r)=>{switch(s){case"futbol":return[ri(r,0,4),ri(r,0,3)];case"basquet":return[ri(r,88,128),ri(r,88,128)];case"beisbol":return[ri(r,0,9),ri(r,0,8)];case"hockey":return[ri(r,0,6),ri(r,0,5)];default:return r()<.5?[3,ri(r,0,2)]:[ri(r,0,2),3]}};
const fmt=d=>d.toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"});
function games(t){const r=rng(t.n),opp=T.filter(x=>x.lg===t.lg&&x!==t),day=864e5,now=Date.now(),res=[],nxt=[];
for(let i=0;i<5;i++){const o=opp[(i+ri(r,0,9))%opp.length],home=i%2===0;let[a,b]=sc(t.s,r);if(t.s!=="futbol"&&a===b)a++;res.push({o,home,a,b,d:new Date(now-(i*4+2)*day)})}
for(let i=0;i<3;i++)nxt.push({o:opp[(i+ri(r,0,9))%opp.length],home:i%2===1,d:new Date(now+(i*5+3)*day)});return{res,nxt}}
const $=document.getElementById("app");let sport="futbol",q="";
function home(){document.title="Equipos del mundo";
$.innerHTML=`<main><h1>Equipos del mundo</h1><p class="sub">Elegí un deporte y buscá tu equipo.</p>
<div class="tabs">${Object.entries(S).map(([k,v])=>`<button data-s="${k}" class="${k===sport?"on":""}">${v}</button>`).join("")}</div>
<input id="q" placeholder="Buscar equipo o liga…" value="${q}" autocomplete="off"><div id="list"></div>
<p class="note">Los datos (posiciones, resultados, próximos partidos) son de ejemplo y no están en vivo. Colores aproximados.</p></main>`;
$.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sport=b.dataset.s;home()});
const inp=$.querySelector("#q");inp.oninput=()=>{q=inp.value;list()};list()}
function list(){const k=q.toLowerCase(),ts=T.filter(t=>t.s===sport&&(t.n+t.lg).toLowerCase().includes(k));let h="",l="";
if(!ts.length)h='<p class="sub">Sin resultados.</p>';
ts.forEach(t=>{if(t.lg!==l){h+=`<div class="lg">${t.lg}</div>`;l=t.lg}h+=`<button class="row" data-id="${t.id}"><span class="dot" style="background:${t.c1}"></span>${t.n}</button>`});
const el=$.querySelector("#list");el.innerHTML=h;el.querySelectorAll(".row").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id})}
function team(t){document.title=t.n;const on=lum(t.c1)>.6?"#111":"#fff",rows=table(t.lg),pos=rows.findIndex(r=>r.t===t)+1,f=t.s==="futbol",{res,nxt}=games(t);
const vs=(g)=>`${g.home?"vs":"@"} ${g.o.n}`;
const out=(g)=>{const mine=g.home?g.a:g.b,his=g.home?g.b:g.a;return mine>his?"W":mine<his?"L":"D"};
$.innerHTML=`<div class="team" style="--c1:${t.c1};--c2:${t.c2};--on:${on}"><div class="hero"><div><button class="back">← Volver</button><h2>${t.n}</h2><p>${t.lg} · ${S[t.s]} · puesto ${pos}º</p></div></div><div class="body">
<div class="card"><h3>Posiciones</h3><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th>${f?"<th>E</th>":""}<th>P</th><th>${f?"Pts":"%"}</th></tr>
${rows.map((r,i)=>`<tr class="${r.t===t?"me":""}"><td>${i+1}</td><td>${r.t.n}</td><td>${r.n}</td><td>${r.g}</td>${f?`<td>${r.e}</td>`:""}<td>${r.p}</td><td>${r.pt}</td></tr>`).join("")}</table></div>
<div class="card"><h3>Próximos partidos</h3>${nxt.map(g=>`<div class="m"><span>${vs(g)}<small>${t.lg}</small></span><span>${fmt(g.d)}</span></div>`).join("")}</div>
<div class="card"><h3>Últimos resultados</h3>${res.map(g=>`<div class="m"><span>${vs(g)}<small>${fmt(g.d)}</small></span><span>${g.home?g.a+" – "+g.b:g.b+" – "+g.a} <span class="chip ${out(g)}">${out(g)==="W"?"G":out(g)==="L"?"P":"E"}</span></span></div>`).join("")}</div></div></div>`;
$.querySelector(".back").onclick=()=>{location.hash="";};window.scrollTo(0,0)}
function route(){const id=location.hash.slice(1),t=T.find(x=>x.id===id);if(t){sport=t.s;team(t)}else home()}
addEventListener("hashchange",route);route();
</script></body></html>
